server {
  listen 80;
  client_max_body_size 70m;
  root /usr/share/nginx/html;

  # Text responses (JS, CSS, JSON incl. proxied API payloads, SVG) compress well; woff2 is already compressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /api/ { proxy_pass http://api:8000; proxy_read_timeout 120s; }

  # Vite emits content-hashed filenames under /assets/, so they can be cached forever.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # Fonts keep stable names, so cache them for a week only.
  location /fonts/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
  # The HTML shell must always be revalidated so a new build is picked up.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
