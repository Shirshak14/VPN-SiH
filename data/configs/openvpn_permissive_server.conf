# Hand-written sample: a server that grew by copy-paste. Every setting here is common in the wild.
port 1194
proto udp
dev tun
server 10.8.0.0 255.255.255.0
ca ca.crt
cert server.crt
key server.key
tls-auth ta.key 0
tls-version-min 1.0
tls-cipher "DEFAULT:@SECLEVEL=0"
cipher AES-128-CBC
auth MD5
compress lz4
allow-compression yes
client-cert-not-required
username-as-common-name
reneg-sec 0
keepalive 10 120
persist-key
persist-tun
verb 3
