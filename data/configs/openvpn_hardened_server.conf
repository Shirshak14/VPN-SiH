# Hand-written sample: a hardened OpenVPN 2.6 server.
port 1194
proto udp
dev tun
server 10.8.0.0 255.255.255.0
ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt-v2 tcv2-server.key
data-ciphers AES-256-GCM:CHACHA20-POLY1305
tls-version-min 1.2
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
crl-verify crl.pem
verify-client-cert require
reneg-sec 3600
allow-compression no
keepalive 10 60
persist-key
persist-tun
user nobody
verb 3
