charon {
    # Legacy / weak algorithms are intentionally allowed for the weak-config scenarios.
    prefer_configured_proposals = yes
    # strongSwan refuses Aggressive Mode + PSK by default; enable it only for the deliberate weak-config lab scenario.
    i_dont_care_about_security_and_use_aggressive_mode_psk = yes
    filelog {
        stderr {
            default = 1
            ike = 4
            cfg = 2
        }
    }
}
